# ============================================================
# my-brand / login: a child theme of keycloak-unfold
# ============================================================
# Copy the whole my-brand/ folder to /opt/keycloak/themes/ (rename it if you like),
# then pick "my-brand" as the realm's Login theme.
# Only the keys and files you add here change; everything else is inherited.

# Base variant: unfold-default (centered card) or unfold-full (split screen)
parent=unfold-default

# Shared brand stylesheet in my-brand/common (see css/my-brand.css)
import=common/my-brand
styles=css/unfold-common.css css/unfold.css css/login-widgets.css css/tailwind.css css/my-brand.css

# ------------------------------------------------------------------
# LOGO: drop logo-light.svg / logo-dark.svg / favicon.svg into
# resources/img/ to replace the defaults, or point to other files:
# ------------------------------------------------------------------
# unfoldLogoUrl=img/my-logo.svg
# unfoldLogoUrlDark=img/my-logo-dark.svg

# ------------------------------------------------------------------
# TERMS OF SERVICE link shown below the login form (hidden when unset)
# ------------------------------------------------------------------
# termsUrl=https://yoursite.com/terms

# ------------------------------------------------------------------
# DARK MODE toggle (on by default). The realm's "Dark mode" switch
# in the admin console also turns it off.
# ------------------------------------------------------------------
# darkMode=false

# ------------------------------------------------------------------
# unfold-full only (set parent=unfold-full above)
# ------------------------------------------------------------------
# bgImage=img/my-hero.jpg
# kcLogoLink=https://yoursite.com
# unfoldQuote=Secure. Simple. Yours.
# unfoldQuoteSubtext=Powered by your company platform.
