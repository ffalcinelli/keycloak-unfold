# ============================================================
# keycloak-unfold — Post-Install Customization Overlay
# unfold-base / login
# ============================================================
#
# Drop this file (and any changed assets) into:
#   /opt/keycloak/themes/unfold-base/login/
#
# Only the keys you include here are applied; everything else
# continues to load from the installed JAR.  You do NOT need
# to copy any CSS or FTL files unless you are changing them.
# ============================================================

# Inherit from the JAR-packaged base (do not remove this line)
parent=unfold-base

# ------------------------------------------------------------------
# LOGO
# Path is relative to the login resources directory.
# Place your files at:
#   themes/unfold-base/login/resources/img/<filename>
# ------------------------------------------------------------------
unfoldLogoUrl=img/logo-light.svg
unfoldLogoUrlDark=img/logo-dark.svg

# ------------------------------------------------------------------
# FAVICON
# Replace the file at:
#   themes/unfold-base/login/resources/img/favicon.svg
# The path is hardcoded in template.ftl, so no property is needed.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# DARK MODE TOGGLE
# The dark/light mode toggle is ENABLED by default.
# To disable it, set this to an empty value or remove the property.
# ------------------------------------------------------------------
darkMode=true

# ------------------------------------------------------------------
# TERMS OF SERVICE URL
# Shown below the login form when set.
# ------------------------------------------------------------------
termsUrl=https://example.com/terms

# ------------------------------------------------------------------
# PRIMARY ACCENT COLOR
# To change the brand color without editing CSS, override the CSS
# custom property via an additional stylesheet listed below.
# See the customization/README.md for a full CSS snippet.
# ------------------------------------------------------------------
# styles=css/unfold-common.css css/unfold.css css/login-widgets.css css/tailwind.css css/my-brand.css
