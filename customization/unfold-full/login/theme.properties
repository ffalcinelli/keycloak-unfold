# ============================================================
# keycloak-unfold — Post-Install Customization Overlay
# unfold-full / login
# ============================================================
#
# Drop this file (and any changed assets) into:
#   /opt/keycloak/themes/unfold-full/login/
#
# Only the keys you include here are applied; everything else
# continues to load from the installed JAR.
# ============================================================

# Inherit from the JAR-packaged base (do not remove this line)
parent=unfold-base

# ------------------------------------------------------------------
# SPLIT-SCREEN BACKGROUND IMAGE
# Path is relative to the login resources directory.
# Place your image at:
#   themes/unfold-full/login/resources/img/<filename>
# Supported formats: JPG, PNG, WebP.
# ------------------------------------------------------------------
bgImage=img/login-bg.jpg

# ------------------------------------------------------------------
# "RETURN TO SITE" BACK-LINK (top-left chevron)
# Set the URL users are taken to when they click the back arrow.
# ------------------------------------------------------------------
# kcLogoLink=https://yoursite.com

# ------------------------------------------------------------------
# SPLIT-SCREEN QUOTE TEXT
# Customise the marketing copy shown over the background image.
# ------------------------------------------------------------------
# unfoldQuote=Secure. Simple. Yours.
# unfoldQuoteSubtext=Powered by your company platform.
