parent=unfold-base

# Split-screen layout: form on the left, hero image on the right (see unfold-base/login/template.ftl)
unfoldLayout=split

# Split-screen background image (relative to login/resources/)
bgImage=img/login-bg.jpg

# "Return to site" back-link URL (top-left arrow). Hidden unless set.
# kcLogoLink=https://yoursite.com

# Marketing copy shown over the background image.
# Defaults come from the unfoldQuote/unfoldQuoteSubtext message keys (translatable);
# set these to override them with fixed text.
# unfoldQuote=Secure. Simple. Yours.
# unfoldQuoteSubtext=Powered by your company platform.
