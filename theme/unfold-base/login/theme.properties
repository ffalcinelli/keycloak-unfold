parent=keycloak.v2
import=common/unfold-base

styles=css/unfold-common.css css/unfold.css css/login-widgets.css css/tailwind.css

# Terms of service link shown below the login form.
# Unset by default: the link is rendered only when this is set.
# termsUrl=https://yoursite.com/terms

# Custom Brand Configuration
# Specify the logo path relative to the login resources (e.g. img/logo.svg)
unfoldLogoUrl=img/logo-light.svg
unfoldLogoUrlDark=img/logo-dark.svg

# Dark mode toggle button (and system dark-mode detection).
# Set to false to disable. Also honours the realm's "Dark mode" switch in the admin console.
darkMode=true
