name: CI

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action pinning
        uses: ffalcinelli/pinner/action@63b8e31e3ca2144f6298fcb0d4b676bb3f1d7be6 # v0.0.13
        with:
          command: 'verify'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint (CSS, JS, version sync)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build CSS
        run: npm run build:css

      - name: Verify committed tailwind.css is up to date
        run: |
          git diff --exit-code -- theme/unfold-base/login/resources/css/tailwind.css \
            || { echo "::error::tailwind.css is stale: run 'npm run build:css' and commit the result"; exit 1; }

      - name: Run unit tests with coverage
        run: mkdir -p coverage && npm run test:unit:ci

      - name: Upload unit test coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: true

      - name: Run visual and E2E tests
        run: npm run test

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package theme JAR
        run: mvn --batch-mode package

      - name: Run E2E tests against the packaged JAR
        run: |
          THEME_JAR=$(ls target/keycloak-unfold-v*.jar | grep -v -e '-sources' -e '-javadoc')
          THEME_JAR="$THEME_JAR" COMPOSE_FILE=docker-compose.jar.yml npm run test
