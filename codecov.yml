coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: false

flag_management:
  default_rules:
    carryforward: true

flags:
  unit:
    paths:
      - theme/unfold-base/login/resources/js/
    carryforward: true
